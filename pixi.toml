[workspace]
name = "servo_webgui"
channels = ["conda-forge", "robostack-jazzy"]
platforms = ["linux-64"]

[dependencies]
ros-jazzy-desktop = "*"
ros-jazzy-rclpy = ">=7.1.3,<8"
colcon-common-extensions = "*"
cmake = "<4"
rosdep = "*"
compilers = "*"
ninja = "*"
setuptools = "<=58.2.0"
pkg-config = ">=0.29.2,<0.30"

[pypi-dependencies]
# pip-only packages your repos need 'some_package = "*"'
numpy = "*"
trimesh = "*"
pycollada = "*"
nicegui = "*"
yourdfpy = "*"

[tasks]
build = "colcon build --symlink-install"
test = "colcon test && colcon test-result --verbose"
clean = "rm -rf build install log"
servo_webgui = "ros2 run servo_pendant_webgui servo_pendant_webgui"

[activation]
scripts = ["install/setup.sh"]
